name: Smart Ventilation (dev)
version: "0.3.0-dev"
slug: smart_ventilation
description: "TEST VERSION: ventilates showers and bathrooms on the humidity curve. Dry-run until you turn on Live control."
url: https://github.com/tlpeter/smart-ventilation
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:fan
panel_title: Smart Ventilation (dev)
homeassistant_api: true
# Dashboard controls (off by default): the app writes one file of its own,
# <packages folder>/smart_ventilation.yaml, and reads configuration.yaml.
map:
  - homeassistant_config:rw
options:
  publish_sensors: false
  log_level: info
schema:
  publish_sensors: bool
  log_level: list(debug|info|warning|error)
